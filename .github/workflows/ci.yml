name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Minimal env vars required for the build and tests to run
      ADMIN_PASSWORD: ci-test-secret-not-real
      DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ─── Install ─────────────────────────────────────────────
      - run: npm ci

      # ─── Static analysis (G28 gate) ─────────────────────────
      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      # ─── Build ───────────────────────────────────────────────
      - name: Build
        run: npm run build

      # ─── Unit tests (Vitest) ─────────────────────────────────
      - name: Unit tests
        run: npm run test

      # ─── E2E tests (Playwright — Chromium only in CI) ────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Chromium)
        run: npx playwright test --project=chromium-desktop
        env:
          ADMIN_EMAIL: admin@sarani.studio
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'ci-test-secret-not-real' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
